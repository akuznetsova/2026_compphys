# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: 7204695b-7485-4989-863c-16cf6e4db155
  title: PHYS 5350
  description: UConn Physics - Computational Physics 
  # keywords: []
  authors:
    - name: Aleksandra Kuznetsova
  references:
    myst-guide: https://mystmd.org/guide
    jupyter: https://docs.jupyter.org/en/latest

  date: ${BUILD_DATE} 
  github: https://github.com/akuznetsova/2026_compphys 
  edit_url: 
  
  plugins:
    - https://github.com/TUD-JB-Templates/JB2_plugins/releases/download/experiment/experiment.mjs
    - https://github.com/jupyter-book/myst-plugins/releases/download/page-last-updatedv1.1/page-last-updated.mjs
  
  # exports and downloads
  exports:
    - format: typst
      template: lapreprint-typst
      output: exports/book.pdf
      id: output-pdf

  # Jupyter Notebook configuration
  jupyter:
    binder:
      repo: https://github.com/executablebooks/thebe-binder-base

  toc:
    - file: index.md                      # the landing page
    - file: content/1_intro.md
    - file: content/2_cheat_sheet.md
    - file: content/lessons/your_turn.md          # dropdown menu
      children:
        - file: content/lessons/1a_intro.md
        - file: content/lessons/1b_python.md
    - file: content/lessons/your_turn.md
      children:
        - file: content/lessons/2_tools.md
        - file: content/lessons/2_visualization.md
    - file: content/lessons/blank.md
      children:
	- file: content/lessons/3_accuracy.md
	- file: content/lessons/3_integration.md
    - file: content/lessons/blank.md
      children:
	- file: content/lessons/4_integration.md
	- file: content/lessons/4_differentiation.md
    - file: content/lessons/blank.md
      children:
	- file: content/lessons/5_eqsystems.md
	- file: content/lessons/5_nonlinear.md
    - file: content/lessons/blank.md
      children:
	- file: content/lessons/6a_ODEs.md
	- file: content/lessons/6b_ODEs.md
    - file: content/lessons/blank.md
      children: 
	- file: content/lessons/7a_ODEs.md
	- file: content/lessons/7b_ODES.md
  abbreviations:
    JB2: Jupyter Book 2
    CI/CD: Continuous Integration/Continuous Deployment
    GHA: GitHub Actions
    GH: GitHub
    IDE: Integrated Development Environment
    VSC: Visual Studio Code
    CLI: commmand line interface

    
site:
  template: book-theme
  options:
    favicon: ./content/figures/favicon.svg      # path to your favicon
    style: ./style/custom.css
    logo: ./content/figures/logo.svg            # path to your logo, shown top left at site
    folders: false
    hide_authors: true
  parts: 
    footer: style/footer.md

  actions:
    - title: HuskyCT
      url: https://huskyct.uconn.edu
